<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PINHO-NETO · Painel de Serviços</title>
    <meta name="description" content="Painel central de serviços auto-hospedados do servidor doméstico PINHO-NETO." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>" />
</head>
<body>
    <div class="bg-gradient" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <header class="site-header">
        <div class="logo" aria-label="PINHO-NETO">
            <span class="logo-mark" aria-hidden="true">
                <span class="logo-pn">PN</span>
            </span>
            <span class="logo-text">
                <span class="logo-pin">PINHO</span><span class="logo-dash">-</span><span class="logo-net">NETO</span>
            </span>
        </div>

        <div class="header-right">
            <div class="clock" id="clock" aria-live="polite">
                <span class="clock-time" id="clock-time">--:--:--</span>
                <span class="clock-date" id="clock-date">—</span>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1 class="hero-title">Painel de Serviços</h1>
            <p class="hero-sub">Acesso rápido a todos os serviços do servidor doméstico <strong>PINHO-NETO</strong>.</p>
        </section>

        <section class="search-section">
            <div class="search-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="search" id="search" class="search-input" placeholder="Pesquisar serviços..." aria-label="Pesquisar serviços" autocomplete="off" />
            </div>
        </section>

        <section id="services" class="services" aria-label="Serviços"></section>

        <p class="no-results" id="no-results" hidden>Nenhum serviço encontrado para a sua pesquisa.</p>
    </main>

    <footer class="site-footer">
        <span>© 2026 PINHO-NETO · Powered by Hermes Agent</span>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
